<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Partidos CDCA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Partidos del fin de semana · CD Ciudad de los Ángeles</title>
<style>
  :root {
    --tinta: #141414;
    --papel: #ffffff;
    --fondo: #efefec;
    --linea: #d6d6d1;
    --verde: #0f7a43;
    --verde-oscuro: #0b6236;
    --suave: #5b5b57;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font-family: "Helvetica Neue", Arial, "Segoe UI", Roboto, sans-serif;
    line-height: 1.45;
    padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  }
  /* Franja con las rayas de la camiseta del club */
  .rayas {
    height: 18px;
    background: repeating-linear-gradient(90deg, #141414 0 18px, #ffffff 18px 36px);
    border-bottom: 2px solid var(--tinta);
    padding-top: env(safe-area-inset-top, 0px);
    box-sizing: content-box;
  }
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 8px; }
  h1 {
    font-size: 1.75rem;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    font-weight: 800;
  }
  .cuando { margin: 0 0 20px; color: var(--suave); font-size: 1rem; }

  .mensaje {
    background: var(--papel);
    border: 2px solid var(--tinta);
    border-radius: 4px;
    overflow: hidden;
  }
  .partido { padding: 14px 16px; font-size: 1.02rem; }
  .partido + .partido { border-top: 1px solid var(--linea); }
  .partido p { margin: 0; overflow-wrap: anywhere; }
  .partido strong { font-weight: 800; }

  .pestanas { display: flex; margin: 0 0 14px; border: 2px solid var(--tinta); border-radius: 4px; overflow: hidden; }
  .pestanas button {
    flex: 1; min-height: 46px; border: 0; border-radius: 0; background: var(--papel); color: var(--tinta);
    font-weight: 700; font-size: 1rem;
  }
  .pestanas button + button { border-left: 2px solid var(--tinta); }
  .pestanas button[aria-selected="true"] { background: var(--tinta); color: #fff; }
  .partido.origen { background: #f6f6f3; color: var(--suave); font-size: 0.9rem; }
  .partido.origen a { color: inherit; }
  .partido.dia { background: var(--tinta); color: #fff; padding: 10px 16px; }
  .semanas { display: flex; gap: 8px; margin: 0 0 12px; }
  .semanas[hidden] { display: none; }
  .semanas button { flex: none; width: 48px; min-height: 46px; padding: 0; font-size: 1rem; background: var(--papel); color: var(--tinta); }
  .semanas button:disabled { opacity: 0.35; cursor: default; }
  .semanas select {
    flex: 1; min-width: 0; min-height: 46px; font: inherit; font-weight: 700; font-size: 1rem; padding: 0 10px;
    color: var(--tinta); background: var(--papel); border: 2px solid var(--tinta); border-radius: 4px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .chips[hidden] { display: none; }
  .chip {
    flex: none; min-height: 42px; padding: 0 12px; font-size: 0.92rem; font-weight: 600;
    background: var(--papel); color: var(--tinta); border: 2px solid var(--tinta);
  }
  .chip[aria-pressed="true"] { background: var(--tinta); color: #fff; }
  .nota { margin: 0; padding: 10px 16px; font-size: 0.9rem; color: var(--suave); border-bottom: 1px solid var(--linea); }
  .tabla-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.clas { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.95rem; }
  table.clas th, table.clas td { padding: 9px 7px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--linea); background: var(--papel); }
  table.clas th { font-weight: 700; font-size: 0.85rem; background: #f6f6f3; }
  table.clas th:nth-child(1), table.clas td:nth-child(1) { position: sticky; left: 0; min-width: 34px; z-index: 1; }
  table.clas th:nth-child(2), table.clas td:nth-child(2) {
    position: sticky; left: 34px; z-index: 1; text-align: left; min-width: 150px; max-width: 190px;
    overflow: hidden; text-overflow: ellipsis; border-right: 2px solid var(--tinta);
  }
  table.clas td:last-child, table.clas th:last-child { font-weight: 800; }
  table.clas tr.nuestro td { font-weight: 800; background: #e8f0ea; }
  .estado { padding: 18px 16px; margin: 0; }
  .aviso { margin: 16px 0 0; color: var(--suave); font-size: 0.92rem; }
  .pie { margin: 22px 0 0; color: var(--suave); font-size: 0.85rem; }

  .barra {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--papel);
    border-top: 2px solid var(--tinta);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  .barra div { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
  button, a.boton {
    flex: 1;
    font: inherit;
    font-weight: 700;
    font-size: 1rem;
    min-height: 52px;
    padding: 0 12px;
    border-radius: 4px;
    border: 2px solid var(--tinta);
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: flex; align-items: center; justify-content: center;
  }
  #copiar { background: var(--papel); color: var(--tinta); }
  #whatsapp { background: var(--verde); color: #fff; border-color: var(--verde-oscuro); }
  button:focus-visible, a.boton:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  .desactivado { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
<div class="rayas" aria-hidden="true"></div>
<main>
  <h1>Partidos del fin de semana</h1>
  <p class="cuando" id="cuando">C.D. Ciudad de los Ángeles</p>

  <div class="pestanas" role="tablist">
    <button type="button" role="tab" id="tab-partidos" aria-selected="true">Partidos</button>
    <button type="button" role="tab" id="tab-resultados" aria-selected="false">Resultados</button>
    <button type="button" role="tab" id="tab-clasificacion" aria-selected="false">Clasificación</button>
  </div>
  <div class="semanas" id="semanas" hidden>
    <button type="button" id="sem-ant" aria-label="Fin de semana anterior">◀</button>
    <select id="sem-sel" aria-label="Elegir fin de semana"></select>
    <button type="button" id="sem-sig" aria-label="Fin de semana siguiente">▶</button>
  </div>
  <div class="chips" id="chips" hidden></div>

  <div class="mensaje" id="mensaje" aria-live="polite">
    <p class="estado">Cargando partidos…</p>
  </div>
  <p class="aviso" id="aviso"></p>
  <p class="pie" id="pie"></p>
</main>

<div class="barra">
  <div>
    <button id="copiar" class="desactivado" type="button">Copiar mensaje</button>
    <a id="whatsapp" class="boton desactivado" href="#" target="_blank" rel="noopener">Enviar por WhatsApp</a>
  </div>
</div>

<script>
(function () {
  var datos = null;
  var activa = "partidos";
  var grupoSel = 0;
  var sel = { partidos: null, resultados: null };   // semana elegida en cada pestaña (posición en datos.semanas)
  var elMensaje = document.getElementById("mensaje");
  var elCuando = document.getElementById("cuando");
  var elAviso = document.getElementById("aviso");
  var elPie = document.getElementById("pie");
  var btnCopiar = document.getElementById("copiar");
  var btnWa = document.getElementById("whatsapp");
  var tabP = document.getElementById("tab-partidos");
  var tabR = document.getElementById("tab-resultados");
  var tabC = document.getElementById("tab-clasificacion");
  var elChips = document.getElementById("chips");
  var elSemanas = document.getElementById("semanas");
  var selSemana = document.getElementById("sem-sel");
  var btnAnt = document.getElementById("sem-ant");
  var btnSig = document.getElementById("sem-sig");

  function escapar(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Igual que WhatsApp: *_texto_* negrita y cursiva, *texto* negrita; los enlaces se ven como enlaces
  function formato(s) {
    return escapar(s)
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/\*_([^_\n*]+)_\*/g, "<strong><em>$1</em></strong>")
      .replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s.,;:!?)])/g, "$1<em>$2</em>");
  }

  function fecha(iso) {
    var p = iso.split("-");
    return p[2] + "/" + p[1];
  }

  function rango(desde, hasta) {
    if (!desde || !hasta) return "C.D. Ciudad de los Ángeles";
    return "Sábado " + fecha(desde) + " y domingo " + fecha(hasta) + "/" + desde.split("-")[0];
  }

  function semanas() {
    return (datos && datos.semanas) || [];
  }

  function sumarDia(iso, n) {
    var d = new Date(iso + "T12:00:00");
    d.setDate(d.getDate() + n);
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + mm + "-" + dd;
  }

  function etiquetaSemana(iso) {
    var dom = sumarDia(iso, 1);
    var a = iso.split("-"), b = dom.split("-");
    return a[1] === b[1] ? a[2] + "-" + b[2] + "/" + b[1] + "/" + b[0]
                         : a[2] + "/" + a[1] + " - " + b[2] + "/" + b[1] + "/" + b[0];
  }

  function indiceSemana(iso) {
    var s = semanas(), i;
    for (i = 0; i < s.length; i++) if (s[i].sabado === iso) return i;
    return s.length - 1;
  }

  function pintarSelectorSemanas() {
    var s = semanas();
    if (activa === "clasificacion" || s.length < 2) { elSemanas.hidden = true; return; }
    elSemanas.hidden = false;
    var i = sel[activa];
    // las más recientes arriba en el desplegable
    selSemana.innerHTML = s.map(function (x, k) { return { x: x, k: k }; }).reverse().map(function (o) {
      return '<option value="' + o.k + '"' + (o.k === i ? " selected" : "") + ">" + etiquetaSemana(o.x.sabado) + "</option>";
    }).join("");
    btnAnt.disabled = i <= 0;
    btnSig.disabled = i >= s.length - 1;
  }

  function clasificaciones() {
    return (datos && datos.clasificaciones) || [];
  }

  // Mensaje de WhatsApp con la clasificación del grupo elegido
  function textoClasificacion() {
    var cl = clasificaciones();
    if (!cl.length) return "";
    var g = cl[Math.min(grupoSel, cl.length - 1)];
    var lineas = ["Información sacada de la web El Balón de Madrid", "", "🏆 *Clasificación*", g.titulo];
    if (g.jornada) lineas.push("📌 _Tras la jornada " + g.jornada + "_");
    lineas.push("");
    g.filas.forEach(function (f) {
      var nombre = f.nuestro ? "*_" + f.nombre + "_*" : f.nombre;
      lineas.push(f.pos + "º " + nombre + " - " + f.pts + " pts (" + f.pj + " PJ)");
    });
    return lineas.join("\n");
  }

  function textoActivo() {
    if (!datos) return "";
    if (activa === "clasificacion") return textoClasificacion();
    var s = semanas();
    if (s.length) {
      var w = s[Math.max(0, Math.min(sel[activa], s.length - 1))];
      return ((activa === "partidos" ? w.partidos : w.resultados) || "").trim();
    }
    return ((activa === "partidos" ? datos.texto : datos.resultados) || "").trim();
  }

  function pintarClasificacion() {
    var cl = clasificaciones();
    elCuando.textContent = "Elige una categoría para ver su clasificación";
    if (!cl.length) {
      elChips.hidden = true;
      elMensaje.innerHTML = '<p class="estado">Todavía no hay clasificaciones disponibles. Aparecerán cuando la federación publique los calendarios.</p>';
      return;
    }
    if (grupoSel >= cl.length) grupoSel = 0;
    elChips.hidden = false;
    elChips.innerHTML = cl.map(function (g, i) {
      return '<button type="button" class="chip" data-i="' + i + '" aria-pressed="' + (i === grupoSel) + '">' + escapar(g.titulo) + "</button>";
    }).join("");

    var g = cl[grupoSel];
    var jugados = g.filas.some(function (f) { return f.pj > 0; });
    var nota = g.jornada ? "Tras la jornada " + g.jornada : (jugados ? "" : "Todavía no se ha jugado ninguna jornada");
    if (!g.jornada && !jugados) nota = "Todavía no se ha jugado ninguna jornada";
    var cab = ["#", "Equipo", "PJ", "G", "E", "P", "GF", "GC", "DG", "Pts"].map(function (c) { return "<th>" + c + "</th>"; }).join("");
    var filas = g.filas.map(function (f) {
      var dg = f.dg > 0 ? "+" + f.dg : f.dg;
      return '<tr' + (f.nuestro ? ' class="nuestro"' : "") + "><td>" + f.pos + "</td><td>" + escapar(f.nombre) + "</td><td>" + f.pj +
        "</td><td>" + f.g + "</td><td>" + f.e + "</td><td>" + f.p + "</td><td>" + f.gf + "</td><td>" + f.gc + "</td><td>" + dg + "</td><td>" + f.pts + "</td></tr>";
    }).join("");
    elMensaje.innerHTML = (nota ? '<p class="nota">' + escapar(nota) + "</p>" : "") +
      '<div class="tabla-wrap"><table class="clas"><thead><tr>' + cab + "</tr></thead><tbody>" + filas + "</tbody></table></div>";
  }

  function pintar() {
    var texto = textoActivo();
    tabP.setAttribute("aria-selected", activa === "partidos");
    tabR.setAttribute("aria-selected", activa === "resultados");
    tabC.setAttribute("aria-selected", activa === "clasificacion");
    elChips.hidden = activa !== "clasificacion";
    if (activa !== "clasificacion") {
      var sm = semanas();
      if (sm.length) {
        var sab = sm[Math.max(0, Math.min(sel[activa], sm.length - 1))].sabado;
        elCuando.textContent = rango(sab, sumarDia(sab, 1));
      } else {
        elCuando.textContent = activa === "partidos"
          ? rango(datos.desde, datos.hasta)
          : rango(datos.resultados_desde, datos.resultados_hasta);
      }
    }
    pintarSelectorSemanas();

    if (activa === "clasificacion") {
      pintarClasificacion();
      if (texto) {
        btnCopiar.classList.remove("desactivado");
        btnWa.classList.remove("desactivado");
        btnWa.href = "https://wa.me/?text=" + encodeURIComponent(texto);
      } else {
        btnCopiar.classList.add("desactivado");
        btnWa.classList.add("desactivado");
        btnWa.href = "#";
      }
    } else if (!texto) {
      elMensaje.innerHTML = activa === "partidos"
        ? '<p class="estado">No hay partidos guardados para este fin de semana. La página se actualiza cada día a primera hora.</p>'
        : '<p class="estado">No hay resultados publicados de este fin de semana. Aparecen según los va publicando la federación.</p>';
      btnCopiar.classList.add("desactivado");
      btnWa.classList.add("desactivado");
      btnWa.href = "#";
    } else {
      elMensaje.innerHTML = texto.split(/\n\s*\n/).map(function (bloque) {
        var esDia = bloque.indexOf("📅") !== -1;
        if (esDia) bloque = bloque.replace(/^━+$/gm, "").trim();   // las líneas ━ solo son para WhatsApp
        var clase = /^Información sacada de la web/.test(bloque) ? " origen" : (esDia ? " dia" : "");
        return '<div class="partido' + clase + '"><p>' + formato(bloque).replace(/\n/g, "<br>") + "</p></div>";
      }).join("");
      btnCopiar.classList.remove("desactivado");
      btnWa.classList.remove("desactivado");
      btnWa.href = "https://wa.me/?text=" + encodeURIComponent(texto);
    }

    var avisos = [];
    if (activa === "partidos" && datos.sin_partido && datos.sin_partido.length) {
      avisos.push("Sin partido este fin de semana: " + datos.sin_partido.join(", ") + ".");
    }
    if (datos.errores && datos.errores.length) {
      avisos.push("No se han podido consultar: " + datos.errores.join(", ") + ". Puede faltar algún dato.");
    }
    elAviso.textContent = avisos.join(" ");

    if (datos.generado) {
      var p = datos.generado.split(" ");
      var d = p[0].split("-");
      elPie.textContent = "Actualizado el " + d[2] + "/" + d[1] + "/" + d[0] + " a las " + p[1] +
        ". Datos de elbalondemadrid.es (RFFM), no oficiales: antes de desplazarte, revisa el acta del partido.";
    }
  }

  function elegir(nombre) {
    activa = nombre;
    if (datos) pintar();
  }

  function copiar() {
    var texto = textoActivo();
    if (!texto) return;
    var aviso = function () {
      btnCopiar.textContent = "Mensaje copiado";
      setTimeout(function () { btnCopiar.textContent = "Copiar mensaje"; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(aviso, alternativa);
    } else {
      alternativa();
    }
    function alternativa() {
      var t = document.createElement("textarea");
      t.value = texto;
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      try { document.execCommand("copy"); aviso(); } catch (e) {}
      document.body.removeChild(t);
    }
  }

  tabP.addEventListener("click", function () { elegir("partidos"); });
  tabR.addEventListener("click", function () { elegir("resultados"); });
  tabC.addEventListener("click", function () { elegir("clasificacion"); });
  selSemana.addEventListener("change", function () { sel[activa] = parseInt(selSemana.value, 10); pintar(); });
  btnAnt.addEventListener("click", function () { if (sel[activa] > 0) { sel[activa] -= 1; pintar(); } });
  btnSig.addEventListener("click", function () { if (sel[activa] < semanas().length - 1) { sel[activa] += 1; pintar(); } });
  elChips.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".chip") : null;
    if (!b) return;
    grupoSel = parseInt(b.getAttribute("data-i"), 10) || 0;
    pintar();
  });
  btnCopiar.addEventListener("click", copiar);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  fetch("partidos.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      datos = d;
      sel.partidos = indiceSemana(d.desde);
      sel.resultados = indiceSemana(d.resultados_desde);
      // Domingo, lunes y martes se abre directamente en Resultados si ya hay alguno
      var dia = new Date().getDay();
      if ((dia === 0 || dia === 1 || dia === 2) && (d.resultados || "").trim()) activa = "resultados";
      pintar();
    })
    .catch(function () {
      elMensaje.innerHTML = '<p class="estado">No se han podido cargar los partidos. Comprueba que la acción "Actualizar partidos" de GitHub se ha ejecutado al menos una vez.</p>';
    });
})();
</script>
</body>
</html>

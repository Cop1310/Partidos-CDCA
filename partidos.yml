name: Actualizar partidos

on:
  schedule:
    # Todos los días a las 06:07 UTC (07:07 u 08:07 en Madrid según la época del año).
    # El minuto NO es "0" a propósito: GitHub retrasa o incluso descarta ejecuciones
    # programadas justo en el minuto en punto de cada hora, que es cuando más carga
    # tienen sus servidores (lo advierten en su propia documentación).
    - cron: "7 6 * * *"
    # Sábados y domingos, cada 10 minutos (de 11:03 a 23:53 en Madrid) para recoger resultados
    # lo antes posible en cuanto la federación los publique
    - cron: "3/10 9-22 * * 6,0"
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-partidos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Generar partidos
        run: python partidos_whatsapp.py --json partidos.json --estado estado.json

      - name: Guardar resultado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add partidos.json estado.json
          git diff --cached --quiet || git commit -m "Actualizar partidos"
          git pull --rebase
          git push

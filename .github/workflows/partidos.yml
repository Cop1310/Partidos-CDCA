name: Actualizar partidos

on:
  schedule:
    # Todos los días a las 06:00 UTC (07:00 o 08:00 en Madrid según la época del año)
    - cron: "0 6 * * *"
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Generar partidos
        run: python partidos_whatsapp.py --json partidos.json

      - name: Guardar resultado
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add partidos.json
          git diff --cached --quiet || git commit -m "Actualizar partidos"
          git push
